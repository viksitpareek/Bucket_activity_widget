<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucket-wise Activity Dashboard</title>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .report-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .report-section + .report-section { margin-top: 20px; }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .report-header h2 { margin: 0; font-size: 18px; color: #1f2937; }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #ownerFilter {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 13px;
            background: #ffffff;
            min-width: 180px;
        }

        #refreshButton {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        #refreshButton:disabled { background: #9ca3af; cursor: not-allowed; }

        .secondary-button {
            background: #ffffff;
            color: #1f2937;
            border: 1px solid #d1d5db;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .secondary-button:hover { background: #f3f4f6; }
        .secondary-button:disabled { color: #9ca3af; cursor: not-allowed; }

        .last-updated { font-size: 12px; color: #6b7280; }

        .table-scroll { overflow-x: auto; }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #d0d7de;
            padding: 9px 10px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #1f4e78;
            color: #ffffff;
        }

        td.bucket-name { text-align: left; font-weight: 600; }
        td.zero { color: #9ca3af; }

        tr.grand-total { background: #d9eaf7; font-weight: 700; }
        tbody tr:nth-child(even) { background: #f7f9fb; }

        .count-link {
            background: none;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            font: inherit;
            font-weight: 700;
            color: #1d4ed8;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .count-link:hover { background: #dbeafe; }
        .count-link.active { background: #1d4ed8; color: #ffffff; text-decoration: none; }

        .count-link:focus-visible,
        .account-link:focus-visible,
        .secondary-button:focus-visible,
        #refreshButton:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: 2px;
        }

        .drill-meta {
            font-size: 13px;
            color: #4b5563;
            margin: -6px 0 12px 0;
        }

        #drillBody td { text-align: left; }
        #drillBody td.row-number { text-align: center; color: #6b7280; width: 56px; }

        .account-link {
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: none;
        }

        .account-link:hover { text-decoration: underline; }

        .load-more-row {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }

        .loading { padding: 40px; text-align: center; color: #6b7280; }

        .error {
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 14px;
            margin-top: 12px;
        }

        .note {
            padding: 10px 14px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            border-radius: 6px;
            color: #92400e;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="report-section">

        <div class="report-header">
            <h2>Bucket Activity Summary</h2>
            <div class="controls">
                <select id="ownerFilter" onchange="onOwnerChange()" aria-label="Account owner">
                    <option value="All Owners">All Owners</option>
                </select>
                <button id="refreshButton" type="button" onclick="loadReport()">Refresh</button>
                <div class="last-updated" id="lastUpdated">Last Updated: -</div>
            </div>
        </div>

        <div id="report">
            <div class="loading">Loading report...</div>
        </div>

    </div>

    <div class="report-section" id="drillSection" hidden>

        <div class="report-header">
            <h2 id="drillTitle">Accounts</h2>
            <button type="button" class="secondary-button" onclick="closeDrill()">Close list</button>
        </div>

        <div class="drill-meta" id="drillMeta"></div>
        <div id="drillBody"></div>

    </div>

</div>

<script>

// ============================================================
// CONFIGURATION
// ============================================================

var READER_FUNCTION = "bucket_activity_reader";

var ALL_OWNERS_KEY = "All Owners";
var ALL_BUCKETS_KEY = "__ALL_BUCKETS__";      // Grand Total row
var TOTAL_ACTIVITY_KEY = "Total";              // Total column
var ACTIVITY_COLUMNS = ["Total", "0-30 Days", "31-60 Days", "61-90 Days", "Not Touched"];

var DRILL_PAGE_SIZE = 200;

// Optional. Leave empty to detect automatically. If account links don't
// open correctly, set this to your CRM base, e.g.
//   "https://crm.zoho.com/crm/org123456789"
// (open any record in CRM and copy the URL part before "/tab/").
var CRM_RECORD_BASE_OVERRIDE = "";


// ============================================================
// STATE
// ============================================================

var lastReportData = null;
var drillState = null;
var drillRequestSeq = 0;
var crmRecordBase = null;


ZOHO.embeddedApp.on("PageLoad", function() {
    resolveCrmRecordBase();
    loadReport();
});

ZOHO.embeddedApp.init();


document.getElementById("report").addEventListener("click", function(event) {
    var button = event.target.closest ? event.target.closest(".count-link") : null;
    if (!button) return;
    openDrill(button, button.getAttribute("data-bucket"), button.getAttribute("data-activity"));
});

document.getElementById("drillBody").addEventListener("click", function(event) {

    if (!event.target.closest) return;

    var link = event.target.closest(".account-link");
    if (link) {
        event.preventDefault();
        openAccount(link.getAttribute("data-account-id"));
        return;
    }

    var loadMore = event.target.closest(".load-more");
    if (loadMore) {
        fetchDrillPage();
    }
});


// ============================================================
// READER CALLS
// ============================================================

function callReader(args) {

    var req_data = { "arguments": JSON.stringify(args || {}) };

    return ZOHO.CRM.FUNCTIONS.execute(READER_FUNCTION, req_data)
        .then(function(response) {
            return { raw: response, data: findPayload(response) };
        });
}


function loadReport() {

    var button = document.getElementById("refreshButton");
    var report = document.getElementById("report");

    button.disabled = true;
    button.innerText = "Loading...";

    closeDrill();

    report.innerHTML = '<div class="loading">Loading report from Zoho CRM...</div>';

    callReader({ "mode": "summary" })

        .then(function(result) {

            var data = result.data;

            if (!data) {
                report.innerHTML =
                    '<div class="error">Response received, but no usable data was found.<br><pre>' +
                    escapeHtml(JSON.stringify(result.raw, null, 2)) + '</pre></div>';
                return;
            }

            if (data.status === "error") {
                report.innerHTML =
                    '<div class="error">' + escapeHtml(data.message || "Unknown error.") + '</div>';
                return;
            }

            lastReportData = data;
            populateOwnerFilter();
            renderTable();

            document.getElementById("lastUpdated").innerText = "Last Updated: " + (data.generated_time || "-");

        })

        .catch(function(error) {
            report.innerHTML =
                '<div class="error">Unable to load report.<br><pre>' +
                escapeHtml(JSON.stringify(error, null, 2)) + '</pre></div>';
        })

        .finally(function() {
            button.disabled = false;
            button.innerText = "Refresh";
        });

}


function findPayload(response, depth) {

    depth = depth || 0;
    if (depth > 8 || response === null || response === undefined) return null;

    if (typeof response === "string") {
        try {
            return findPayload(JSON.parse(response), depth + 1);
        } catch (e) {
            return null;
        }
    }

    if (typeof response === "object") {

        if (Array.isArray(response.owner_names) ||
            Array.isArray(response.accounts) ||
            response.status === "error") {
            return response;
        }

        var priorityKeys = ["output", "details", "result", "response", "data"];

        for (var i = 0; i < priorityKeys.length; i++) {
            if (response[priorityKeys[i]] !== undefined) {
                var found = findPayload(response[priorityKeys[i]], depth + 1);
                if (found) return found;
            }
        }

        for (var key in response) {
            if (priorityKeys.indexOf(key) !== -1) continue;
            var found2 = findPayload(response[key], depth + 1);
            if (found2) return found2;
        }
    }

    return null;
}


// ============================================================
// SUMMARY TABLE
// ============================================================

function populateOwnerFilter() {

    var select = document.getElementById("ownerFilter");
    var currentValue = select.value || ALL_OWNERS_KEY;

    select.innerHTML = '<option value="All Owners">All Owners</option>';

    (lastReportData.owner_names || []).forEach(function(name) {
        var option = document.createElement("option");
        option.value = name;
        option.innerText = name;
        select.appendChild(option);
    });

    select.value = currentValue;
    if (select.value !== currentValue) {
        select.value = ALL_OWNERS_KEY;
    }

}


function onOwnerChange() {
    closeDrill();
    renderTable();
}


function countCell(bucketKey, activity, value) {

    var count = Number(value) || 0;

    if (count <= 0) {
        return '<td class="zero">0</td>';
    }

    return '<td><button type="button" class="count-link"' +
        ' data-bucket="' + escapeHtml(bucketKey) + '"' +
        ' data-activity="' + escapeHtml(activity) + '"' +
        ' title="Show these ' + count + ' accounts">' + count + '</button></td>';
}


function renderTable() {

    if (!lastReportData) return;

    var selectedOwner = document.getElementById("ownerFilter").value || ALL_OWNERS_KEY;

    var summary = lastReportData.owner_bucket_summary || {};
    var bucketData = summary[selectedOwner] || {};

    var buckets = Object.keys(bucketData).sort(function(a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    if (buckets.length === 0) {
        document.getElementById("report").innerHTML =
            '<div class="loading">No bucket data for this owner.</div>';
        return;
    }

    var html = '<div class="table-scroll"><table><thead><tr>';
    html += '<th style="text-align:left;">Bucket</th>';
    ACTIVITY_COLUMNS.forEach(function(column) {
        html += '<th>' + escapeHtml(column) + '</th>';
    });
    html += '</tr></thead><tbody>';

    var grand = { "Total": 0, "0-30 Days": 0, "31-60 Days": 0, "61-90 Days": 0, "Not Touched": 0 };

    buckets.forEach(function(bucket) {

        var row = bucketData[bucket];

        html += '<tr>';
        html += '<td class="bucket-name">' + escapeHtml(bucket) + '</td>';

        ACTIVITY_COLUMNS.forEach(function(column) {
            html += countCell(bucket, column, row[column]);
            grand[column] += Number(row[column]) || 0;
        });

        html += '</tr>';

    });

    html += '<tr class="grand-total">';
    html += '<td class="bucket-name">Grand Total</td>';
    ACTIVITY_COLUMNS.forEach(function(column) {
        html += countCell(ALL_BUCKETS_KEY, column, grand[column]);
    });
    html += '</tr>';

    html += '</tbody></table></div>';

    document.getElementById("report").innerHTML = html;

}


// ============================================================
// ACCOUNT DRILL-DOWN
// ============================================================

function openDrill(button, bucket, activity) {

    var owner = document.getElementById("ownerFilter").value || ALL_OWNERS_KEY;

    var active = document.querySelectorAll(".count-link.active");
    for (var i = 0; i < active.length; i++) active[i].classList.remove("active");
    if (button) button.classList.add("active");

    drillState = {
        owner: owner,
        bucket: bucket,
        activity: activity,
        accounts: [],
        total: null,
        generationId: null,
        loading: false
    };

    var bucketLabel = bucket === ALL_BUCKETS_KEY ? "All buckets" : bucket;
    var activityLabel = activity === TOTAL_ACTIVITY_KEY ? "All activity" : activity;

    document.getElementById("drillTitle").innerText = bucketLabel + ", " + activityLabel;
    document.getElementById("drillMeta").innerText = "Owner: " + owner;
    document.getElementById("drillBody").innerHTML = '<div class="loading">Loading accounts...</div>';

    var section = document.getElementById("drillSection");
    section.hidden = false;

    if (section.scrollIntoView) {
        section.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    fetchDrillPage();
}


function fetchDrillPage() {

    var state = drillState;
    if (!state || state.loading) return;

    state.loading = true;
    var requestId = ++drillRequestSeq;

    var loadMore = document.querySelector("#drillBody .load-more");
    if (loadMore) {
        loadMore.disabled = true;
        loadMore.innerText = "Loading...";
    }

    callReader({
        "mode": "accounts",
        "owner": state.owner,
        "bucket": state.bucket,
        "activity": state.activity,
        "offset": state.accounts.length,
        "limit": DRILL_PAGE_SIZE
    })

        .then(function(result) {

            if (drillState !== state || requestId !== drillRequestSeq) return;

            var data = result.data;

            if (!data) {
                renderDrill("Response received, but no account list was found.");
                return;
            }

            if (data.status === "error") {
                renderDrill(data.message || "Unknown error.");
                return;
            }

            state.accounts = state.accounts.concat(data.accounts || []);
            state.total = Number(data.total_count) || 0;
            state.generationId = data.generation_id || null;

            renderDrill();
        })

        .catch(function(error) {
            if (drillState !== state || requestId !== drillRequestSeq) return;
            renderDrill("Unable to load accounts: " + JSON.stringify(error));
        })

        .finally(function() {
            state.loading = false;
            var button = document.querySelector("#drillBody .load-more");
            if (button && drillState === state) {
                button.disabled = false;
            }
        });
}


function renderDrill(errorMessage) {

    var state = drillState;
    if (!state) return;

    var html = "";

    if (state.generationId && lastReportData && lastReportData.generation_id &&
        state.generationId !== lastReportData.generation_id) {
        html += '<div class="note">The report was refreshed after this page loaded, so this list may not match ' +
            'the counts above. Click Refresh to update the summary.</div>';
    }

    if (state.accounts.length > 0) {

        var showOwner = state.owner === ALL_OWNERS_KEY;
        var showBucket = state.bucket === ALL_BUCKETS_KEY;
        var showActivity = state.activity === TOTAL_ACTIVITY_KEY;

        html += '<div class="table-scroll"><table><thead><tr>';
        html += '<th>#</th><th style="text-align:left;">Account Name</th>';
        if (showOwner) html += '<th style="text-align:left;">Account Owner</th>';
        if (showBucket) html += '<th style="text-align:left;">Bucket</th>';
        if (showActivity) html += '<th style="text-align:left;">Activity</th>';
        html += '</tr></thead><tbody>';

        state.accounts.forEach(function(account, index) {
            html += '<tr>';
            html += '<td class="row-number">' + (index + 1) + '</td>';
            html += '<td>' + accountLink(account) + '</td>';
            if (showOwner) html += '<td>' + escapeHtml(account.owner) + '</td>';
            if (showBucket) html += '<td>' + escapeHtml(account.bucket) + '</td>';
            if (showActivity) html += '<td>' + escapeHtml(account.activity) + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table></div>';

    } else if (!errorMessage) {
        html += '<div class="loading">No accounts found for this selection.</div>';
    }

    if (errorMessage) {
        html += '<div class="error">' + escapeHtml(errorMessage) + '</div>';
    }

    if (state.total !== null && state.accounts.length < state.total) {
        html += '<div class="load-more-row"><button type="button" class="secondary-button load-more">' +
            'Load ' + Math.min(DRILL_PAGE_SIZE, state.total - state.accounts.length) + ' more</button></div>';
    }

    document.getElementById("drillBody").innerHTML = html;

    var meta = "Owner: " + state.owner;
    if (state.total !== null) {
        meta += " | Showing " + state.accounts.length + " of " + state.total + " accounts";
    }
    meta += " | Click an account name to open it in Zoho CRM";
    document.getElementById("drillMeta").innerText = meta;
}


function closeDrill() {

    drillState = null;
    drillRequestSeq++;

    document.getElementById("drillSection").hidden = true;
    document.getElementById("drillBody").innerHTML = "";

    var active = document.querySelectorAll(".count-link.active");
    for (var i = 0; i < active.length; i++) active[i].classList.remove("active");
}


// ============================================================
// OPEN ACCOUNT IN ZOHO CRM
// ============================================================

function accountLink(account) {

    var url = buildRecordUrl(account.id);

    return '<a class="account-link" href="' + escapeHtml(url || "#") + '"' +
        ' target="_blank" rel="noopener"' +
        ' data-account-id="' + escapeHtml(account.id) + '">' +
        escapeHtml(account.name || "(No Name)") + '</a>';
}


function buildRecordUrl(accountId) {
    if (!crmRecordBase || !accountId) return null;
    return crmRecordBase + "/tab/Accounts/" + encodeURIComponent(accountId);
}


function openAccount(accountId) {

    if (!accountId) return;

    // 1. Open in a new browser tab so the dashboard stays where it is.
    var url = buildRecordUrl(accountId);

    if (url) {
        var win = null;
        try { win = window.open(url, "_blank"); } catch (e) { win = null; }
        if (win) {
            try { win.opener = null; } catch (e) {}
            return;
        }
    }

    // 2. Fallback: ask Zoho CRM to open the record itself.
    try {
        var promise = ZOHO.CRM.UI.Record.open({ Entity: "Accounts", RecordID: accountId });
        if (promise && typeof promise.catch === "function") {
            promise.catch(function() { showOpenError(accountId); });
        }
    } catch (e) {
        showOpenError(accountId);
    }
}


function showOpenError(accountId) {

    var body = document.getElementById("drillBody");
    var existing = document.getElementById("openError");
    if (existing) existing.remove();

    var div = document.createElement("div");
    div.id = "openError";
    div.className = "error";
    div.innerText = "Couldn't open account " + accountId +
        " in Zoho CRM. Set CRM_RECORD_BASE_OVERRIDE in the widget code to your CRM URL.";
    body.insertBefore(div, body.firstChild);
}


function resolveCrmRecordBase() {

    if (CRM_RECORD_BASE_OVERRIDE) {
        crmRecordBase = CRM_RECORD_BASE_OVERRIDE.replace(/\/+$/, "");
        return;
    }

    var origin = detectCrmOrigin();
    if (!origin) return;

    try {
        var promise = ZOHO.CRM.CONFIG.getOrgInfo();
        if (!promise || typeof promise.then !== "function") return;

        promise.then(function(info) {
            var domain = findValueByKey(info, "domain_name", 0);
            if (!domain) return;

            crmRecordBase = origin + "/crm/" + encodeURIComponent(domain);

            var links = document.querySelectorAll("#drillBody .account-link");
            for (var i = 0; i < links.length; i++) {
                var url = buildRecordUrl(links[i].getAttribute("data-account-id"));
                if (url) links[i].setAttribute("href", url);
            }
        }).catch(function() {});
    } catch (e) {}
}


function detectCrmOrigin() {

    var candidates = [];

    try {
        var ancestors = window.location.ancestorOrigins;
        if (ancestors) {
            for (var i = 0; i < ancestors.length; i++) candidates.push(ancestors[i]);
        }
    } catch (e) {}

    try {
        if (document.referrer) candidates.push(new URL(document.referrer).origin);
    } catch (e) {}

    for (var j = 0; j < candidates.length; j++) {
        if (/^https:\/\/crm\.zoho(cloud)?\.[a-z.]+$/i.test(candidates[j])) {
            return candidates[j];
        }
    }

    return null;
}


function findValueByKey(obj, key, depth) {

    if (depth > 6 || obj === null || typeof obj !== "object") return null;

    if (obj[key]) return obj[key];

    for (var k in obj) {
        var found = findValueByKey(obj[k], key, depth + 1);
        if (found) return found;
    }

    return null;
}


// ============================================================
// UTILITIES
// ============================================================

function formatNumber(value) {
    if (value === undefined || value === null || value === "") return "0";
    var number = Number(value);
    return isNaN(number) ? String(value) : number.toLocaleString("en-IN");
}


function escapeHtml(value) {
    if (value === undefined || value === null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
