<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucket-wise Activity Dashboard</title>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 { margin: 0 0 8px 0; font-size: 22px; color: #1f2937; }
        .header p { margin: 0; color: #6b7280; font-size: 14px; }

        #refreshButton {
            margin-top: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #refreshButton:disabled { background: #9ca3af; cursor: not-allowed; }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card-title { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
        .card-value { font-size: 26px; font-weight: bold; color: #111827; }

        .report-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .report-header h2 { margin: 0; font-size: 18px; color: #1f2937; }

        #ownerFilter {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 13px;
            background: #ffffff;
            min-width: 180px;
        }

        .last-updated { font-size: 12px; color: #6b7280; }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #d0d7de;
            padding: 9px 10px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #1f4e78;
            color: #ffffff;
        }

        td.bucket-name { text-align: left; font-weight: 600; }

        tr.grand-total { background: #d9eaf7; font-weight: 700; }
        tbody tr:nth-child(even) { background: #f7f9fb; }

        .loading { padding: 40px; text-align: center; color: #6b7280; }

        .error {
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .summary-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Bucket-wise Activity Dashboard</h1>
        <p>Owner-filterable view of account activity by Bucket</p>
        <button id="refreshButton" onclick="loadReport()">Refresh Report</button>
    </div>

    <div class="summary-cards">
        <div class="card">
            <div class="card-title">Total Accounts</div>
            <div class="card-value" id="totalAccounts">-</div>
        </div>
        <div class="card">
            <div class="card-title">Accounts With Calls</div>
            <div class="card-value" id="accountsWithCalls">-</div>
        </div>
        <div class="card">
            <div class="card-title">Accounts Without Calls</div>
            <div class="card-value" id="accountsWithoutCalls">-</div>
        </div>
    </div>

    <div class="report-section">

        <div class="report-header">
            <h2>Bucket Activity Summary</h2>
            <div style="display:flex;align-items:center;gap:12px;">
                <select id="ownerFilter" onchange="renderTable()">
                    <option value="All Owners">All Owners</option>
                </select>
                <div class="last-updated" id="lastUpdated">Last Updated: -</div>
            </div>
        </div>

        <div id="report">
            <div class="loading">Loading report...</div>
        </div>

    </div>

</div>

<script>

var lastReportData = null;


ZOHO.embeddedApp.on("PageLoad", function() {
    loadReport();
});

ZOHO.embeddedApp.init();


function loadReport() {

    var button = document.getElementById("refreshButton");
    var report = document.getElementById("report");

    button.disabled = true;
    button.innerText = "Loading...";

    report.innerHTML = '<div class="loading">Loading report from Zoho CRM...</div>';

    var req_data = { "arguments": JSON.stringify({}) };

    ZOHO.CRM.FUNCTIONS.execute("bucket_activity_reader", req_data)

        .then(function(response) {

            var data = findPayload(response);

            if (!data) {
                report.innerHTML =
                    '<div class="error">Response received, but no usable data was found.<br><pre>' +
                    escapeHtml(JSON.stringify(response, null, 2)) + '</pre></div>';
                return;
            }

            if (data.status === "error") {
                report.innerHTML =
                    '<div class="error">' + escapeHtml(data.message || "Unknown error.") + '</div>';
                return;
            }

            lastReportData = data;
            populateOwnerFilter();
            renderTable();

            document.getElementById("totalAccounts").innerText = formatNumber(data.total_accounts);
            document.getElementById("accountsWithCalls").innerText = formatNumber(data.accounts_with_calls);
            document.getElementById("accountsWithoutCalls").innerText = formatNumber(data.accounts_without_calls);
            document.getElementById("lastUpdated").innerText = "Last Updated: " + (data.generated_time || "-");

        })

        .catch(function(error) {
            report.innerHTML =
                '<div class="error">Unable to load report.<br><pre>' +
                escapeHtml(JSON.stringify(error, null, 2)) + '</pre></div>';
        })

        .finally(function() {
            button.disabled = false;
            button.innerText = "Refresh Report";
        });

}


function findPayload(response, depth) {

    depth = depth || 0;
    if (depth > 8 || response === null || response === undefined) return null;

    if (typeof response === "string") {
        try {
            return findPayload(JSON.parse(response), depth + 1);
        } catch (e) {
            return null;
        }
    }

    if (typeof response === "object") {

        if (Array.isArray(response.owner_names) || response.status === "error") {
            return response;
        }

        var priorityKeys = ["output", "details", "result", "response", "data"];

        for (var i = 0; i < priorityKeys.length; i++) {
            if (response[priorityKeys[i]] !== undefined) {
                var found = findPayload(response[priorityKeys[i]], depth + 1);
                if (found) return found;
            }
        }

        for (var key in response) {
            if (priorityKeys.indexOf(key) !== -1) continue;
            var found2 = findPayload(response[key], depth + 1);
            if (found2) return found2;
        }
    }

    return null;
}


function populateOwnerFilter() {

    var select = document.getElementById("ownerFilter");
    var currentValue = select.value || "All Owners";

    select.innerHTML = '<option value="All Owners">All Owners</option>';

    (lastReportData.owner_names || []).forEach(function(name) {
        var option = document.createElement("option");
        option.value = name;
        option.innerText = name;
        select.appendChild(option);
    });

    select.value = currentValue;
    if (select.value !== currentValue) {
        select.value = "All Owners";
    }

}


function renderTable() {

    if (!lastReportData) return;

    var selectedOwner = document.getElementById("ownerFilter").value || "All Owners";

    var summary = lastReportData.owner_bucket_summary || {};
    var bucketData = summary[selectedOwner] || {};

    var buckets = Object.keys(bucketData).sort(function(a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    var html = '<table><thead><tr>';
    html += '<th style="text-align:left;">Bucket</th>';
    html += '<th>Total</th><th>0-30 Days</th><th>31-60 Days</th><th>61-90 Days</th><th>Not Touched</th>';
    html += '</tr></thead><tbody>';

    var grand = { "Total": 0, "0-30 Days": 0, "31-60 Days": 0, "61-90 Days": 0, "Not Touched": 0 };

    buckets.forEach(function(bucket) {

        var row = bucketData[bucket];

        html += '<tr>';
        html += '<td class="bucket-name">' + escapeHtml(bucket) + '</td>';
        html += '<td>' + row.Total + '</td>';
        html += '<td>' + row["0-30 Days"] + '</td>';
        html += '<td>' + row["31-60 Days"] + '</td>';
        html += '<td>' + row["61-90 Days"] + '</td>';
        html += '<td>' + row["Not Touched"] + '</td>';
        html += '</tr>';

        grand.Total += row.Total;
        grand["0-30 Days"] += row["0-30 Days"];
        grand["31-60 Days"] += row["31-60 Days"];
        grand["61-90 Days"] += row["61-90 Days"];
        grand["Not Touched"] += row["Not Touched"];

    });

    html += '<tr class="grand-total">';
    html += '<td class="bucket-name">Grand Total</td>';
    html += '<td>' + grand.Total + '</td>';
    html += '<td>' + grand["0-30 Days"] + '</td>';
    html += '<td>' + grand["31-60 Days"] + '</td>';
    html += '<td>' + grand["61-90 Days"] + '</td>';
    html += '<td>' + grand["Not Touched"] + '</td>';
    html += '</tr>';

    html += '</tbody></table>';

    if (buckets.length === 0) {
        html = '<div class="loading">No bucket data for this owner.</div>';
    }

    document.getElementById("report").innerHTML = html;

}


function formatNumber(value) {
    if (value === undefined || value === null || value === "") return "0";
    var number = Number(value);
    return isNaN(number) ? String(value) : number.toLocaleString("en-IN");
}


function escapeHtml(value) {
    if (value === undefined || value === null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
